<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>素数判定</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
    }
    h1 {
      font-size: 1.8rem;
      color: #1a202c;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #718096;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    input[type="number"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="number"]:focus {
      border-color: #667eea;
    }
    button {
      padding: 12px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button:hover { background: #5a67d8; }
    .result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }
    .result.prime {
      background: #f0fff4;
      color: #276749;
      border: 2px solid #9ae6b4;
    }
    .result.not-prime {
      background: #fff5f5;
      color: #9b2c2c;
      border: 2px solid #feb2b2;
    }
    .result.show { display: block; }
    .detail {
      margin-top: 8px;
      font-size: 0.85rem;
      font-weight: 400;
      color: inherit;
      opacity: 0.8;
    }
    .factors {
      margin-top: 16px;
      padding: 12px 16px;
      background: #f7fafc;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #4a5568;
      font-weight: 400;
      text-align: left;
      display: none;
    }
    .factors.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>素数判定</h1>
    <p class="subtitle">整数を入力して、素数かどうか判定します</p>
    <div class="input-row">
      <input type="number" id="numInput" placeholder="整数を入力..." min="0" />
      <button onclick="check()">判定</button>
    </div>
    <div class="result" id="result">
      <span id="resultText"></span>
      <div class="detail" id="resultDetail"></div>
    </div>
    <div class="factors" id="factors"></div>
  </div>

  <script>
    // --- Baillie-PSW primality test ---

    function modpow(base, exp, mod) {
      let result = 1n;
      base = ((base % mod) + mod) % mod;
      while (exp > 0n) {
        if (exp & 1n) result = result * base % mod;
        exp >>= 1n;
        base = base * base % mod;
      }
      return result;
    }

    // Jacobi symbol (a/n)
    function jacobi(a, n) {
      a = ((a % n) + n) % n;
      let j = 1;
      while (a !== 0n) {
        while (a % 2n === 0n) {
          a >>= 1n;
          const r = n & 7n;
          if (r === 3n || r === 5n) j = -j;
        }
        [a, n] = [n, a];
        if ((a & 3n) === 3n && (n & 3n) === 3n) j = -j;
        a %= n;
      }
      return n === 1n ? j : 0;
    }

    function millerRabin(n, a) {
      if (n === a) return true;
      if (n % a === 0n) return false;
      let d = n - 1n, r = 0n;
      while (!(d & 1n)) { d >>= 1n; r++; }
      let x = modpow(a, d, n);
      if (x === 1n || x === n - 1n) return true;
      for (let i = 1n; i < r; i++) {
        x = x * x % n;
        if (x === n - 1n) return true;
      }
      return false;
    }

    // Strong Lucas probable prime test (Selfridge parameters, P=1)
    function strongLucas(n) {
      let D = 5n, sign = 1n;
      for (;;) {
        const cand = sign * D;
        const j = jacobi(cand, n);
        if (j === -1) { D = cand; break; }
        if (j === 0) return false;
        D += 2n; sign = -sign;
      }
      const Dmod = ((D % n) + n) % n;
      const Qmod = (((1n - D) / 4n % n) + n) % n;
      const inv2 = (n + 1n) >> 1n; // mod inverse of 2 (n is odd)

      let d = n + 1n, s = 0n;
      while (!(d & 1n)) { d >>= 1n; s++; }

      let U = 1n, V = 1n, Qk = Qmod; // U_1=1, V_1=P=1
      const bits = d.toString(2);
      for (let i = 1; i < bits.length; i++) {
        // Double step
        U = U * V % n;
        V = (V * V % n + n - 2n * Qk % n) % n;
        Qk = Qk * Qk % n;
        if (bits[i] === '1') {
          // Add-1 step (P=1)
          const U1 = (U + V) % n * inv2 % n;
          const V1 = (Dmod * U % n + V) % n * inv2 % n;
          Qk = Qk * Qmod % n;
          U = U1; V = V1;
        }
      }

      if (U === 0n || V === 0n) return true;
      for (let r = 1n; r < s; r++) {
        V = (V * V % n + n - 2n * Qk % n) % n;
        Qk = Qk * Qk % n;
        if (V === 0n) return true;
      }
      return false;
    }

    // Baillie-PSW: MR(base=2) + Strong Lucas (no known pseudoprimes)
    function isPrime(n) {
      if (n < 2n) return false;
      const small = [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n, 29n, 31n, 37n];
      for (const p of small) {
        if (n === p) return true;
        if (n % p === 0n) return false;
      }
      return millerRabin(n, 2n) && strongLucas(n);
    }

    // --- Pollard's rho (Brent's improvement + batch GCD) ---

    function gcd(a, b) {
      while (b) { [a, b] = [b, a % b]; }
      return a;
    }

    function pollardBrent(n) {
      if (n % 2n === 0n) return 2n;
      for (let c = 1n; ; c++) {
        let y = 1n, r = 1n, q = 1n, g = 1n, x, ys;
        while (g === 1n) {
          x = y;
          for (let i = 0n; i < r; i++) y = (y * y + c) % n;
          let k = 0n;
          while (k < r && g === 1n) {
            ys = y;
            const step = r - k < 128n ? r - k : 128n;
            for (let i = 0n; i < step; i++) {
              y = (y * y + c) % n;
              q = q * (x > y ? x - y : y - x) % n;
            }
            g = gcd(q, n);
            k += 128n;
          }
          r *= 2n;
        }
        if (g === n) {
          g = 1n;
          while (g === 1n) {
            ys = (ys * ys + c) % n;
            g = gcd(x > ys ? x - ys : ys - x, n);
          }
        }
        if (g !== n) return g;
      }
    }

    function primeFactors(n) {
      if (n < 2n) return [];
      const result = [];
      const stack = [n];
      while (stack.length) {
        const v = stack.pop();
        if (v === 1n) continue;
        if (isPrime(v)) {
          result.push(v);
        } else {
          const d = pollardBrent(v);
          stack.push(d, v / d);
        }
      }
      return result.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
    }

    function check() {
      const input = document.getElementById('numInput').value.trim();
      const result = document.getElementById('result');
      const resultText = document.getElementById('resultText');
      const resultDetail = document.getElementById('resultDetail');
      const factorsDiv = document.getElementById('factors');

      if (!/^-?\d+$/.test(input)) {
        resultText.textContent = '有効な整数を入力してください';
        result.className = 'result not-prime show';
        resultDetail.textContent = '';
        factorsDiv.className = 'factors';
        return;
      }

      const n = BigInt(input);

      if (n < 0n) {
        resultText.textContent = `${n} は負の数です`;
        result.className = 'result not-prime show';
        resultDetail.textContent = '素数は2以上の自然数です';
        factorsDiv.className = 'factors';
        return;
      }

      if (isPrime(n)) {
        resultText.textContent = `${n} は素数です！`;
        result.className = 'result prime show';
        resultDetail.textContent = '1とその数自身のみで割り切れます';
        factorsDiv.className = 'factors';
      } else {
        resultText.textContent = `${n} は素数ではありません`;
        result.className = 'result not-prime show';
        if (n < 2n) {
          resultDetail.textContent = '素数は2以上の自然数です';
          factorsDiv.className = 'factors';
        } else {
          const factors = primeFactors(n);
          resultDetail.textContent = '';
          factorsDiv.textContent = `素因数分解: ${n} = ${factors.join(' × ')}`;
          factorsDiv.className = 'factors show';
        }
      }
    }

    document.getElementById('numInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') check();
    });
  </script>
</body>
</html>
